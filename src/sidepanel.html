<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatGPT Explorer</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="app-header">
    <div>
      <h1>ChatGPT Explorer</h1>
      <p>Local conversation tree</p>
    </div>
  </header>

  <main id="main">
    <section class="toolbar" aria-label="Explorer actions">
      <button id="add-folder" type="button">+ Folder</button>
      <button id="add-chat" type="button">+ Current chat</button>
    </section>

    <section class="secondary-toolbar">
      <label for="view-mode">View</label>
      <select id="view-mode">
        <option value="explorer">Explorer</option>
        <option value="families">Families</option>
      </select>

      <label for="sort-mode">Sort</label>
      <select id="sort-mode">
        <option value="manual">Manual</option>
        <option value="az">A → Z</option>
        <option value="za">Z → A</option>
      </select>

      <label class="quick-add-control" title="Capture normal ChatGPT conversation-link clicks instead of opening them.">
        <input id="quick-add-mode" type="checkbox">
        <span>Quick add</span>
      </label>
      <label class="quick-add-control" title="Observe explicit ChatGPT branch actions and visible branch-parent markers.">
        <input id="branch-tracking-mode" type="checkbox">
        <span>Track branches</span>
      </label>
    </section>

    <section class="tree-toolbar" aria-label="Tree display actions">
      <button id="collapse-all" class="quiet" type="button">Collapse all</button>
      <button id="expand-all" class="quiet" type="button">Expand all</button>
      <button id="export-data" class="quiet push-right" type="button">Export</button>
      <button id="import-data" class="quiet" type="button">Import</button>
      <input id="import-file" type="file" accept="application/json,.json" hidden>
    </section>

    <div id="selection-hint" class="selection-hint">Selected: 0 · Add destination: root</div>
    <div id="status" class="status" role="status" aria-live="polite"></div>

    <div id="root-drop-zone" class="root-drop-zone" aria-hidden="true">Move to root</div>

    <section id="tree" class="tree" role="tree" aria-label="Conversation tree"></section>

    <section id="empty-state" class="empty-state" hidden>
      <strong id="empty-title">No items yet.</strong>
      <span id="empty-detail">Create a folder or add the currently open ChatGPT conversation.</span>
    </section>

    <p class="keyboard-help">Ctrl+click: toggle · Shift+click: range · F2: rename · Delete: remove · Esc: clear</p>
  </main>

  <script src="storage.js"></script>
  <script src="settings.js"></script>
  <script src="conversation-utils.js"></script>
  <script src="selection.js"></script>
  <script src="tree-ops.js"></script>
  <script src="branch-ops.js"></script>
  <script src="drag-manager.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
